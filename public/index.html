<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BattleBots Head-to-Head — Who Does Reddit Think Wins?</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Bright Data x BattleBots</p>
        <h1>Who does Reddit think wins?</h1>
      </header>

      <form id="matchup">
        <div class="selector-vs">
          <div class="bot-picker" id="pickerA">
            <img id="previewA" class="bot-preview" src="/img/minotaur.png" alt="Minotaur" width="120" height="120" />
            <select id="botA"><option value="">Loading…</option></select>
            <p class="picker-meta" id="pickerMetaA">Drum spinner · RioBotz</p>
          </div>
          <span class="vs-badge" id="vs-badge">VS</span>
          <div class="bot-picker" id="pickerB">
            <img id="previewB" class="bot-preview" src="/img/tombstone.png" alt="Tombstone" width="120" height="120" />
            <select id="botB"><option value="">Loading…</option></select>
            <p class="picker-meta" id="pickerMetaB">Horizontal spinner · Hardcore Robotics</p>
          </div>
        </div>
        <button type="submit" id="btn">Who wins?</button>
      </form>

      <div id="suggestions" class="suggestions"></div>

      <!-- Status bar -->
      <section id="status-bar" class="status-bar" hidden style="display:none" role="status" aria-live="polite">
        <div class="status-dot"></div>
        <span id="status-text">Starting analysis…</span>
      </section>

      <!-- Early sentiment (shows BEFORE LLM finishes) -->
      <section id="early-sentiment" class="early-sentiment" hidden style="display:none"></section>

      <!-- Verdict card -->
      <section id="verdict-card" class="verdict-card" hidden>
        <div class="verdict-top">
          <div class="verdict-bot" id="vbot-a">
            <img id="v-imgA" src="" alt="" width="100" height="100" />
            <strong id="v-nameA"></strong>
            <div id="v-barsA" class="mini-bars"></div>
          </div>
          <div class="verdict-center">
            <p class="verdict-label">Reddit says</p>
            <h2 id="verdict-winner"></h2>
            <span id="verdict-confidence" class="conf-badge"></span>
          </div>
          <div class="verdict-bot" id="vbot-b">
            <img id="v-imgB" src="" alt="" width="100" height="100" />
            <strong id="v-nameB"></strong>
            <div id="v-barsB" class="mini-bars"></div>
          </div>
        </div>
        <div id="verdict-narrative" class="verdict-narrative"></div>
        <div id="curated-evidence" class="curated-evidence"></div>
        <p id="llm-note" class="llm-note"></p>
        <div class="verdict-brand">Analyzed with <a href="https://brightdata.com" target="_blank" rel="noreferrer">Bright Data</a> SERP API</div>
      </section>

      <details id="all-evidence" class="all-evidence" hidden>
        <summary>All Reddit mentions (<span id="evidence-count">0</span>)</summary>
        <div id="evidence-list" class="evidence-list"></div>
      </details>

      <details id="trace-details" hidden>
        <summary class="trace-toggle">Bright Data SERP trace</summary>
        <table><thead><tr><th>Query</th><th>Status</th><th>Results</th><th>Time</th></tr></thead><tbody id="trace-body"></tbody></table>
      </details>

      <footer>Powered by <a href="https://brightdata.com" target="_blank" rel="noreferrer">Bright Data</a></footer>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
